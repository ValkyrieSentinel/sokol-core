[package]
name = "orchestrator"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
aya = "0.14"
common = { path = "../common", features = ["std"] }
tokio = { version = "1.0", features = ["full"] }
clap = { version = "4.0", features = ["derive", "env"] }
log = "0.4"
env_logger = "0.10"
ctrlc = { version = "3.2", features = ["termination"] }
anyhow = "1.0"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
# ML-DSA-65 (FIPS 204), pure Rust (RustCrypto): mesh identities and envelope signatures.
ml-dsa = "0.1.1"
blake3 = "1.5"
axum = "0.7"
sysinfo = "0.39"
futures-util = "0.3"
serde_json = "1.0"
chrono = "0.4"
ipnet = "2.9"
libc = "0.2"
# Plain-HTTP client for the local CrowdSec API (sokol-crowdsec); no TLS stack needed on localhost.
ureq = { version = "2", default-features = false }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
tower = { version = "0.5", features = ["util"] }

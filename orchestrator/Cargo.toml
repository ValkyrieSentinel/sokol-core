[package]
name = "orchestrator"
version = "0.1.0"
edition = "2021"

[dependencies]
aya = { version = "0.12", features = ["default", "tokio"] }
common = { path = "../common", features = ["std"] }
tokio = { version = "1.0", features = ["full"] }
clap = { version = "4.0", features = ["derive"] }
log = "0.4"
env_logger = "0.10"
ctrlc = { version = "3.2", features = ["termination"] }
anyhow = "1.0"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
pqcrypto-dilithium = "0.5"
pqcrypto-traits = "0.3.5"
blake3 = "1.5"
axum = "0.7"
sysinfo = "0.39"
futures-util = "0.3"
serde_json = "1.0"
chrono = "0.4"
ipnet = "2.9"
libc = "0.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

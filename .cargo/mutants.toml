# cargo-mutants: mutants that are equivalent or cannot be observed by a unit test.
# Every entry says why. Commands, baseline and open survivors: docs/MUTATION.md.
exclude_re = [
    # Disjoint bits: `|` and `^` give the same value.
    "replace \\| with \\^ in from_hex$",
    "replace \\| with \\^ in tcp_flags::is_invalid$",
    # The reference implementation kept inside the tests, not code the node runs.
    "in tests::Old::",
    # The kernel map: needs a loaded XDP program; the XDP smoke covers it.
    "KernelBlocklist",
    # The monitor's process entry: the XDP smoke runs `monitor --regret` on its audit log.
    "bin/monitor.rs:\\d+:\\d+: replace main -> io::Result<\\(\\)> with Ok\\(\\(\\)\\)$",
    "bin/monitor.rs:\\d+:\\d+: delete match arm Some\\(\"--regret\"\\) in main$",
    # Directory fsync for durability; not observable without crash injection.
    "in sync_dir",
    # An offset while the clock has not stepped: 0 and +-1 ms are indistinguishable from it.
    "replace wall_offset_ms -> i64 with (0|1|-1)$",
    # wall / local is 1 while the clock has not stepped, inside the tolerance of
    # the_table_clock_starts_on_the_wall_clock; a step cannot be made in a unit test.
    "replace - with / in wall_offset_ms$",
    # `tick` ends a claim at its end before `counts` reads it
    # (an_enforced_peer_claim_ends_at_its_exact_end), so `>` and `>=` agree there.
    "replace > with >= in BlockTable<B>::counts$",
    # Compaction threshold of strike_order: a different threshold compacts at another time
    # with the same result. Thresholds that compact on every call time out (caught).
    "replace (> with ==|> with >=|\\* with \\+) in BlockTable<B>::strike_order_due$",
    # Replay compares a detector's TTL and claim; a static or operator block does not change
    # either on the current table (probed 2026-10-07).
    "match guard t.starts_with\\(\"(STATIC_BLOCK_|OPERATOR_BAN_)\"\\) with false in replay_records",
    # keep_aside keeps nothing either way when the link fails for another reason.
    "replace match guard e.kind\\(\\) == std::io::ErrorKind::AlreadyExists with true in keep_aside$",
    # serde refuses repeated fields and a second top-level key on its own; the strict check
    # adds nothing an accepted message could carry (p2p a_signed_payload_has_one_meaning).
    # Not the length bound of a bare string: a unit variant would then be refused.
    "replace check_canonical -> Result<\\(\\), common::canonical::CanonicalError> with Ok\\(\\(\\)\\)$",
    "replace && with \\|\\| in check_canonical$",
]

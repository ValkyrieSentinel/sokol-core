name: Stargate shadow contract
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  delivery:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.15'
      - name: Pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Native outbox regressions and socket traces
        run: scripts/check-delivery.sh
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: s0fractal/stargate
          ref: f898003d16707fbeceee0cb7c2559bdaa6a4e076
          path: .stargate-checker
          persist-credentials: false
      - name: Install the pinned shadow checker
        run: python -m pip install ./.stargate-checker
      - name: Actual checkout versus the certified model and semantic mutants
        # No --expect-results: this checks this PR's actual source and reports its digest.
        # Frozen results-v2.json bytes are compared manually from an authorized Sokol checkout.
        run: python .stargate-checker/integration/sokol_delivery.py --sokol-root "$GITHUB_WORKSPACE"
      - name: Retry and reconnect traces versus the certified model
        run: python .stargate-checker/integration/sokol_traces.py --sokol-root "$GITHUB_WORKSPACE"
      - name: Bounded FIFO, flush limits and overflow accounting
        run: python .stargate-checker/integration/sokol_queue.py --sokol-root "$GITHUB_WORKSPACE"

name: Stargate shadow contract
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  delivery:
    # Normal live + frozen runs take about two minutes; hangs must fail closed.
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.15'
      - name: Pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Native outbox regressions and socket traces
        run: scripts/check-delivery.sh
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: s0fractal/stargate
          ref: d512620994fd1f063b2a2c68f8ce137bf9fe714f
          path: .stargate-checker
          persist-credentials: false
      - name: Install the pinned shadow checker
        run: python -m pip install ./.stargate-checker
      - name: Actual checkout versus the certified model and semantic mutants
        # No --expect-results: this checks this PR's actual source and reports its digest.
        # Frozen experiments are reproduced separately below on exact historical source.
        run: python .stargate-checker/integration/sokol_delivery.py --sokol-root "$GITHUB_WORKSPACE"
      - name: Retry and reconnect traces versus the certified model
        run: python .stargate-checker/integration/sokol_traces.py --sokol-root "$GITHUB_WORKSPACE"
      - name: Bounded FIFO, flush limits and overflow accounting
        run: python .stargate-checker/integration/sokol_queue.py --sokol-root "$GITHUB_WORKSPACE"
      - name: Actual outbox against checked local effects and recovery receipts
        # Toy SQLite receiver, actual Rust transport; six scenarios and two semantic mutants.
        run: python .stargate-checker/integration/sokol_receipts.py --sokol-root "$GITHUB_WORKSPACE"
      - name: Retained sender budgets and recovery across actual process exits
        run: python .stargate-checker/integration/sokol_intents.py --sokol-root "$GITHUB_WORKSPACE"
      - name: Exact source for the frozen experiments
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ github.repository }}
          ref: 5ffaf0854158f4674a470378279a4dd4d237f9fb
          path: .stargate-frozen-sokol
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /orchestrator/src/delivery.rs
            /scripts/stargate_delivery_probe.rs
      - name: Reproduce current frozen experiment bytes
        run: |
          python .stargate-checker/integration/sokol_delivery.py --sokol-root .stargate-frozen-sokol --expect-results .stargate-checker/examples/sokol-delivery/results-v2.json
          python .stargate-checker/integration/sokol_traces.py --sokol-root .stargate-frozen-sokol --expect-results .stargate-checker/examples/sokol-delivery/trace-results.json
          python .stargate-checker/integration/sokol_queue.py --sokol-root .stargate-frozen-sokol --expect-results .stargate-checker/examples/sokol-queue/results.json
          python .stargate-checker/integration/sokol_intents.py --sokol-root .stargate-frozen-sokol --expect-results .stargate-checker/examples/sokol-intents/results.json

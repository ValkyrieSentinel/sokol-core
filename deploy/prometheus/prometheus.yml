# Example Prometheus configuration for a Sokol-Core mesh.
#
# A node serves metrics only with --metrics-bind, without authentication. Bind it to an address
# the monitoring host reaches over a private link (the WireGuard mesh, a management network),
# never a public one: e.g. --metrics-bind 10.200.0.1:9469 for a node whose wg0 is 10.200.0.1.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - sokol-alerts.yml

scrape_configs:
  - job_name: sokol          # the alert rules select job="sokol"
    static_configs:
      - targets: ['10.200.0.1:9469', '10.200.0.2:9469', '10.200.0.3:9469']
        labels:
          mesh: pilot
